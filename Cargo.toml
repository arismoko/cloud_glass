[package]
name = "mod-cloudglass"
version = "1.1.4"
edition = "2024"
license = "MIT"
description = "Cloud Glass for Sunrise: sixteen see-through, walk-through cloud glass blocks"
# Ported from: Cloud Glass 1.1.0 (Mrbysco/CloudGlass, MIT), Minecraft Java 1.21.1 NeoForge.
# The textures, models and lang are the upstream mod's own MIT files; tools/gen_content.py
# writes the rest of the content from the upstream checkout.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
